name: Build & Publish Offline Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install all dependencies & run tests
        run: |
          npm ci
          npm test

      - name: Build offline bundle (production node_modules included)
        run: |
          rm -rf node_modules
          npm ci --omit=dev
          mkdir -p release-stage/oauth-workbench
          cp -r src public package.json package-lock.json README.md node_modules release-stage/oauth-workbench/
          tar -czf oauth-workbench-${{ github.ref_name }}.tar.gz -C release-stage oauth-workbench
          (cd release-stage && zip -rq ../oauth-workbench-${{ github.ref_name }}.zip oauth-workbench)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            oauth-workbench-${{ github.ref_name }}.tar.gz
            oauth-workbench-${{ github.ref_name }}.zip
